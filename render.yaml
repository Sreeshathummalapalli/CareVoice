services:
  - type: web
    name: carevoice
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    disk:
      name: carevoice-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: CAREVOICE_DATA_DIR
        value: /var/data
      - key: CAREVOICE_ACTION_BIND
        value: 127.0.0.1
      - key: CAREVOICE_ACTION_PORT
        value: "8765"
      - key: CAREVOICE_VAPID_PRIVATE_KEY_FILE
        value: /var/data/vapid_private.pem
      - key: CAREVOICE_ACTION_SECRET_FILE
        value: /var/data/reminder_action_secret
      - key: CAREVOICE_SERVICE_WORKER_URL
        value: /app/static/carevoice-sw.js
      - key: CAREVOICE_VAPID_SUBJECT
        sync: false
      - key: GROQ_API_KEY
        sync: false
