<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    body { margin: 0; color: #0f172a; background: transparent; }
    .voice { padding: 12px 0; text-align: center; }
    .mic {
      width: 82px; height: 82px; display: inline-grid; place-items: center;
      border: 0; border-radius: 50%; color: white; background: #166534;
      font-size: 36px; cursor: pointer; box-shadow: 0 5px 16px #16653438;
    }
    .mic[aria-pressed="true"] { background: #dc2626; box-shadow: 0 0 0 9px #dc26262b; }
    .status { margin-top: 10px; color: #166534; font-size: 14px; font-weight: 700; }
    .caption { min-height: 22px; max-width: 560px; margin: 8px auto 0; color: #334155; font-size: 15px; }
  </style>
</head>
<body>
  <main class="voice">
    <button class="mic" id="mic" type="button" aria-label="Tap to speak" aria-pressed="false">🎙️</button>
    <div class="status" id="status" aria-live="polite">Tap to Speak</div>
    <div class="caption" id="caption" aria-live="polite"></div>
  </main>
  <script src="./index.js"></script>
</body>
</html>
