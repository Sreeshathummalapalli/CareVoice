<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; color: #0f172a; background: transparent; font: 14px Arial, sans-serif; }
    .setup { display: flex; align-items: center; gap: 12px; padding: 5px 0; }
    button { border: 0; border-radius: 6px; padding: 10px 14px; color: #fff; background: #166534; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    span { color: #475569; }
  </style>
</head>
<body>
  <div class="setup">
    <button id="enable" type="button">Enable browser medicine notifications</button>
    <span id="status" aria-live="polite">Allow notifications to receive reminders while this tab is inactive.</span>
  </div>
  <script src="./index.js"></script>
</body>
</html>
